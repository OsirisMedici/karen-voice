name: Text processing tests

on:
  push:
    paths:
      - src-tauri/src/audio_toolkit/text.rs
      - .github/workflows/text-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the real text module tests without native audio dependencies
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/karen-voice-text-tests"
          mkdir -p "$TEST_ROOT/src"
          cat > "$TEST_ROOT/Cargo.toml" <<'TOML'
          [package]
          name = "karen-voice-text-tests"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          natural = "0.5.0"
          once_cell = "1"
          regex = "1"
          strsim = "0.11.0"
          TOML
          printf '#[path = "%s/src-tauri/src/audio_toolkit/text.rs"]\nmod text;\n' "$GITHUB_WORKSPACE" > "$TEST_ROOT/src/lib.rs"
          cargo test --manifest-path "$TEST_ROOT/Cargo.toml"
